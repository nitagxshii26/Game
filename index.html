<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Catcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Start Screen -->
  <div id="start-screen" class="screen">
    <h1 class="title">Data Catcher</h1>
    <p class="tagline">Help the robot catch the data and avoid the bugs</p>
    <button id="start-button" class="start-button">Start Game</button>
  </div>

  <!-- Game Screen -->
  <div id="game-screen" class="screen hidden">
    <div id="game-area" class="game-area">
      <div id="score" class="score">Score: 0</div>
      <div id="lives" class="lives">❤️❤️❤️</div>
      <div id="player" class="player">🤖</div>
      <div id="game-over" class="game-over hidden">
        <h2 class="game-over-title">Game Over</h2>
        <p id="final-score" class="final-score"></p>
        <button id="play-again-button" class="play-again-button">Play Again</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
